<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#f5f7fb" />
        <title>PTAdmin</title>
        <style>
            #__ptadmin_boot_loader__ {
                position: fixed;
                inset: 0;
                display: grid;
                place-items: center;
                background: #f5f7fb;
                color: #38527a;
                font:
                    600 14px/1.5 system-ui,
                    sans-serif;
                z-index: 9999;
                transition: opacity 0.22s ease;
            }
            #__ptadmin_boot_loader__.is-leaving {
                opacity: 0;
                pointer-events: none;
            }
            #__ptadmin_boot_loader__ span {
                display: inline-flex;
                align-items: center;
                gap: 10px;
            }
            #__ptadmin_boot_loader__ i {
                width: 18px;
                height: 18px;
                border: 2px solid #dce6ff;
                border-top-color: #3f6fd9;
                border-radius: 50%;
                animation: ptadmin-spin 0.8s linear infinite;
            }
            @keyframes ptadmin-spin {
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
      <script type="module" crossorigin src="./assets/index-CMUEtaXX.js"></script>
      <link rel="stylesheet" crossorigin href="./assets/index-6EB2SfbI.css">
    </head>
    <body>
        <div id="__ptadmin_boot_loader__" aria-live="polite">
            <span>
                <i aria-hidden="true"></i>
                正在启动 PTAdmin…
            </span>
        </div>
        <div id="app"></div>
    </body>
</html>
