        <style>
            #__ptadmin_boot_loader__ {
                position: fixed;
                inset: 0;
                z-index: 9999;
                transition: opacity 0.22s ease;
            }
            #__ptadmin_boot_loader__.is-leaving {
                opacity: 0;
                pointer-events: none;
            }
            .ptadmin-loader-container {
                display: flex;
                align-items: center;
                justify-content: center;
                flex-direction: column;
                background:
                    radial-gradient(circle at top, rgba(34, 116, 255, 0.28), transparent 32%),
                    linear-gradient(180deg, #0f172a 0%, #111827 100%);
                color: #ffffff;
            }

            .ptadmin-loader-ring {
                position: relative;
                width: 78px;
                height: 78px;
            }

            .ptadmin-loader-ring::before,
            .ptadmin-loader-ring::after {
                content: '';
                position: absolute;
                inset: 0;
                border-radius: 50%;
                border: 4px solid transparent;
            }

            .ptadmin-loader-ring::before {
                border-top-color: #4da3ff;
                border-right-color: #21c2c2;
                animation: ptadmin-loader-spin 1.35s linear infinite;
            }

            .ptadmin-loader-ring::after {
                inset: 14%;
                border-bottom-color: #ff8a3d;
                border-left-color: #4da3ff;
                animation: ptadmin-loader-spin 1s linear reverse infinite;
            }

            .ptadmin-loader-text {
                margin-top: 18px;
                font-size: 13px;
                letter-spacing: 0.08em;
                color: rgba(255, 255, 255, 0.82);
            }

            @keyframes ptadmin-loader-spin {
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
